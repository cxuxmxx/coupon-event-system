spring:
  application:
    name: joonggo-core

  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3306/joonggo?useUnicode=yes&characterEncoding=UTF-8&rewriteBatchedStatements=true
      username: joonggo_admin
      password: 1234
      maximum-pool-size: 10
      max-lifetime: 30000
      connection-timeout: 3000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      port: 6380
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 20GB

  cloud:
    aws:
      stack:
        auto: false
      credentials:
        access-key: AKIAQ3SFZZDWF7JN7BT7
        secret-key: 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
      region:
        static: ap-northeast-2
      s3:
        bucket: gpt-service-bucket
jwt:
